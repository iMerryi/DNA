<svg viewBox="0 0 680 366" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>解码纠错与 DNA 再生闭环流程</title>
<desc>读取笔形装置铭文区获得密钥，解码 DNA 序列得到 option_key 词；词表命中则放行，未命中则 AI 粗配召回候选、C++ DP 细筛确定最终词；随后计算损坏程度分级，正常则界面显示，超阈值则用原文与铭文密钥重新生成 DNA 替换受损序列。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">

<rect x="40" y="48" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">① 读取笔形装置</text>
<text x="115" y="89" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">铭文区→身份+密钥</text>
<path d="M190 76 L242 76" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="48" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="325" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">② C++ 解码</text>
<text x="325" y="89" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">载荷 v3 → 英文词</text>
<path d="M400 76 L452 76" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="460" y="48" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">③ 词表精确命中</text>
<text x="550" y="89" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">放行 / 待验证词</text>
<path d="M550 104 L550 137" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="460" y="145" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="167" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">④ AI 粗配</text>
<text x="550" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">词表召回候选</text>
<path d="M460 173 L406 173" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="145" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="325" y="167" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">⑤ C++ DP 细筛</text>
<text x="325" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">最小差异定词</text>
<path d="M250 173 L196 173" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="145" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="167" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">⑥ 损坏程度分级</text>
<text x="115" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">完好·轻度·中度·严重</text>
<path d="M115 201 L115 237" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="245" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="267" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑦ 再生判定</text>
<text x="115" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">阈值 + 未纠正词</text>
<path d="M190 260 L234 240" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="212" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">正常</text>
<path d="M190 286 L234 316" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="212" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">超阈值</text>

<rect x="250" y="210" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">⑧ 界面表格显示</text>
<text x="340" y="251" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">最终词 + 损坏标签</text>

<rect x="250" y="290" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">⑨ 重新生成 DNA</text>
<text x="340" y="331" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">原文+铭文密钥→新序列</text>

</g>
</svg>
